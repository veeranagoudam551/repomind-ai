name: CI

# Runs the same checks a contributor would run locally per the README's
# "Getting Started" section - backend pytest, frontend tsc/eslint, and the
# Playwright e2e suite - against a clean, disposable GitHub Actions runner,
# not this project's own dev machine.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned to what this project has actually been developed and verified
  # against (`python --version` / `node --version` on the dev machine),
  # not the latest available - avoids CI drifting to a version nobody's
  # tested this code on.
  PYTHON_VERSION: "3.9"
  NODE_VERSION: "20"
  # Matches .env.example's defaults exactly (same credentials
  # docker/docker-compose.yml uses, Day 40) so no per-job DATABASE_URL
  # override is needed beyond pointing at localhost.
  POSTGRES_USER: repomind
  POSTGRES_PASSWORD: changeme
  POSTGRES_DB: repomind

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U repomind -d repomind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://repomind:changeme@localhost:5432/repomind
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      # No OPENAI_API_KEY/ANTHROPIC_API_KEY/QDRANT_*/REDIS_URL here: every
      # backend test mocks its external call (httpx.MockTransport for
      # OpenAI/Anthropic/GitHub/Qdrant, monkeypatched Celery .delay()) per
      # conftest.py and each service's own test file - see Days 14-15,
      # 17-18, 38, 42-43. Nothing in this suite makes a live network call.
      - name: Run backend test suite
        working-directory: backend
        run: pytest

  frontend:
    name: Frontend typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # .next/ (and the typed-route declarations tsc needs) is gitignored
      # and only ever generated locally by `next dev`/`next build` - every
      # day since 11 that touched a typed route has run this by hand
      # first; CI needs the same step since nothing else triggers it here.
      - name: Generate Next.js route types
        working-directory: frontend
        run: npx next typegen

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npx eslint .

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    # Waits on the two quicker jobs so an obviously-broken push fails fast
    # without also paying for Playwright browser install + three services.
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U repomind -d repomind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:latest
        ports: ["6333:6333"]
        # No --health-cmd: confirmed on Day 40 (see docker/docker-compose.yml)
        # that Qdrant's official image is a minimal Debian slim base with no
        # guaranteed shell tools to probe with from inside the container.
        # Readiness is checked from the runner instead - "Wait for Qdrant"
        # step below - the same reasoning applied there.
    env:
      DATABASE_URL: postgresql+asyncpg://repomind:changeme@localhost:5432/repomind
      REDIS_URL: redis://localhost:6379/0
      QDRANT_HOST: localhost
      QDRANT_PORT: 6333
      # Raises GitHub's API rate limit from 60/hr (unauthenticated, shared
      # across every concurrent GitHub Actions job on GitHub's IP range -
      # a real flakiness risk) to 5000/hr, same as README's GITHUB_TOKEN
      # paragraph. The workflow's own automatic token is read-only against
      # public data and needs no repo secret to be configured.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      # Deliberately absent: OPENAI_API_KEY, ANTHROPIC_API_KEY. The e2e
      # suite is specifically designed to assert the graceful inline error
      # both produce when unset (Days 19-37) rather than require either
      # provider - matching this task's "no paid API access" requirement
      # without weakening any assertion.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # tests-e2e/python-bin.ts (Day 44) resolves this same .venv/bin/python
      # path on Linux - global-setup.ts and seed.ts shell out to it directly
      # rather than assuming `python`/`python3` on PATH, matching how a
      # contributor's own local run works per the README.
      - name: Create backend virtualenv
        working-directory: backend
        run: python -m venv .venv

      - name: Install backend dependencies
        working-directory: backend
        run: .venv/bin/pip install -r requirements.txt -r requirements-dev.txt

      - name: Apply database migrations
        working-directory: backend
        run: .venv/bin/alembic upgrade head

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:6333/collections && exit 0
            sleep 1
          done
          echo "Qdrant did not become ready in time" >&2
          exit 1

      # No --pool=solo here (README's Windows-only workaround for the lack
      # of os.fork() - Day 34) - the default "prefork" pool works as-is on
      # this Linux runner.
      - name: Start Celery worker
        working-directory: backend
        run: |
          .venv/bin/celery -A app.core.celery_app worker --loglevel=info &
          for i in $(seq 1 15); do
            .venv/bin/celery -A app.core.celery_app inspect ping -t 2 >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "Celery worker did not become ready in time" >&2
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e suite
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docker:
    name: Docker build validation
    runs-on: ubuntu-latest
    # No `needs:` (Day 53) - independent of backend/frontend/e2e above on
    # purpose, so a Dockerfile/build-context regression is caught exactly
    # as fast as an application-level one, not gated behind them. This
    # job builds nothing the other jobs run - it exists because, before
    # today, neither Dockerfile had ever actually been built by anyone or
    # anything, only reviewed statically (Days 47-53's own audits).
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Two separate targets (Day 51): the default "production" target
      # must never install fastembed's ~150MB dependency tree, and
      # "with-local-embedding" must build cleanly with it. Building both
      # is the actual point of this job - a target-name typo or a broken
      # COPY in either would previously have gone unnoticed until someone
      # built it by hand for the first time.
      - name: Build backend image (production target)
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: production
          push: false
          tags: repomind-backend:ci-production-${{ github.run_id }}
          cache-from: type=gha,scope=backend-production
          cache-to: type=gha,mode=max,scope=backend-production

      - name: Build backend image (with-local-embedding target)
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: with-local-embedding
          push: false
          tags: repomind-backend:ci-local-embedding-${{ github.run_id }}
          cache-from: type=gha,scope=backend-local-embedding
          cache-to: type=gha,mode=max,scope=backend-local-embedding

      # NEXT_PUBLIC_API_BASE_URL is public, build-time-only configuration
      # (never a secret - Next.js inlines it into the JavaScript shipped
      # to the browser). Set to the same value docker-compose.yml's `full`
      # profile actually builds with by default
      # (COMPOSE_FRONTEND_API_BASE_URL's own default) rather than the
      # Dockerfile's bare-build fallback (http://localhost:8000), so this
      # exercises the real Compose deployment path, not a different one.
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: repomind-frontend:ci-${{ github.run_id }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://api:8000
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # Config-only, never `up` - confirms docker-compose.yml itself is
      # valid and every ${VAR:-default}/profile/target reference resolves
      # without starting anything. JWT_SECRET_KEY gets an obviously-fake,
      # CI-only placeholder purely to avoid Compose's "variable not set"
      # warning for the one var with no :-default; GITHUB_TOKEN/
      # OPENAI_API_KEY/ANTHROPIC_API_KEY are deliberately left unset, same
      # reasoning as the backend/e2e jobs above - genuinely optional at
      # this layer, and an unset one resolves to an empty string (a
      # warning, not a failure), so there is nothing secret to print.
      - name: Validate docker-compose.yml (full profile)
        env:
          JWT_SECRET_KEY: ci-docker-config-validation-placeholder
        run: docker compose -f docker/docker-compose.yml --profile full config

  docker-smoke:
    name: Docker Compose full-stack smoke test
    runs-on: ubuntu-latest
    needs: docker
    # Gated on the `docker` job above (Day 54), not for image reuse -
    # GitHub Actions jobs run in separate, disposable VMs with no way to
    # share locally-built images between them without a registry
    # (explicitly out of scope: no push, no registry login anywhere in
    # this workflow) - purely so this job doesn't spend several minutes
    # starting the full stack when `docker` already found the images
    # don't even build.
    timeout-minutes: 20
    env:
      # No usable default in docker-compose.yml (a real secret, by
      # design - see the `docker` job's own compose-config step above);
      # an obviously-fake, CI-only value, never used anywhere real.
      # GITHUB_TOKEN/OPENAI_API_KEY/ANTHROPIC_API_KEY are deliberately
      # left unset: this smoke test only proves the stack *starts and
      # talks to itself*, not that ingestion/search/chat/agent work, so
      # no external API key is needed or requested.
      JWT_SECRET_KEY: ci-docker-smoke-test-placeholder
      POSTGRES_PASSWORD: ci-docker-smoke-postgres-password
      # Explicit, though already docker-compose.yml's own default (Day
      # 51) - this smoke test validates the production,
      # EMBEDDING_PROVIDER=openai path (also compose's own unconfigured
      # default, since nothing here sets EMBEDDING_PROVIDER at all), not
      # the ~150MB heavier local-embedding image.
      BACKEND_DOCKER_TARGET: production
    steps:
      - uses: actions/checkout@v4

      # `--wait` blocks until every service with a healthcheck reports
      # healthy - postgres, redis, api, celery-worker, frontend - or, for
      # qdrant (no healthcheck by design, see docker-compose.yml's own
      # comment), simply running; a fixed sleep would either be too
      # short (flaky) or too long (wasted CI time) for no reason.
      # Bounded by --wait-timeout rather than left to hang indefinitely
      # if a container never becomes healthy.
      - name: Start the full profile (build + wait for healthy)
        run: |
          docker compose -f docker/docker-compose.yml --profile full \
            up -d --build --wait --wait-timeout 180

      - name: Service status
        if: always()
        run: docker compose -f docker/docker-compose.yml --profile full ps

      # Reuses scripts/smoke_check.py (Day 50) rather than re-implementing
      # the same GET /health, GET /health/ready, and frontend checks here -
      # exactly the tool it exists for. It never touches repository
      # ingestion, search, chat, debug, or the agent - only three plain
      # GET requests - so no OpenAI/Anthropic call happens anywhere in
      # this job.
      - name: Run smoke_check.py against the running stack
        run: |
          python3 scripts/smoke_check.py \
            --frontend-url http://localhost:3000 \
            --api-url http://localhost:8000 \
            --timeout 10

      # Always, not just on failure - a startup-error review is useful
      # for a human reading a passing run too, not only a post-mortem on
      # a failing one. Never dumps environment variables or a settings
      # object - only what each service already logs about its own
      # requests/startup, same "no secrets in logs" standard the
      # application code itself is held to (Day 52).
      - name: Show recent service logs
        if: always()
        run: |
          docker compose -f docker/docker-compose.yml --profile full logs \
            --no-color --tail=100 postgres redis api celery-worker frontend

      # Runs even if an earlier step failed, so a broken stack never
      # lingers on the runner. `-v` (also removing the named volumes) is
      # safe specifically because this is a disposable, isolated
      # environment this same job just created from scratch - never
      # appropriate against a real developer machine or deployment.
      - name: Stop and remove the stack
        if: always()
        run: docker compose -f docker/docker-compose.yml --profile full down -v
